version: '3'
services:
  service1:
    build: .
    container_name: service1-container
    ports:
      - "8000:3040"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "<http://localhost:8000>"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  service2:
    build: .
    container_name: service2-container
    ports:
      - "3000:3040"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "<http://localhost:3000>"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s