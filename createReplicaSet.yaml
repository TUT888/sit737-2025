apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: prac6p-replicaset
  labels:
    app: myapp
    tier: backend
spec:
  # modify replicas according to your case
  replicas: 3
  selector:
    matchLabels:
      tier: backend
  template:
    metadata:
      labels:
        tier: backend
    spec:
      containers:
      - name: node-cal-service
        image: tut888/sit737-prac6p-service
        ports:
        - containerPort: 3040